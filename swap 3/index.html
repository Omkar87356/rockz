<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habitly — Anime RPG Personal Development System</title>
  <meta name="description" content="Habitly is a futuristic anime RPG personal development system where habits become quests, consistency awards XP, and daily execution levels up your life.">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◈</text></svg>">

  <!-- Google Fonts: Futuristic Anime RPG Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./src/styles/main.css">

  <!-- High-Speed Production React 18 (Loads in milliseconds) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root">
    <!-- Instant Fallback Anime RPG System Skeleton -->
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020611; color: #00E5FF; font-family: 'Orbitron', sans-serif;">
      <div style="position: relative; width: 44px; height: 44px; margin-bottom: 20px;">
        <div style="width: 100%; height: 100%; border: 2px solid rgba(0, 229, 255, 0.2); border-top-color: #00E5FF; border-bottom-color: #7C3AED; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="position: absolute; inset: 6px; border: 1px dashed rgba(0, 255, 156, 0.4); border-radius: 50%; animation: spin-rev 1.2s linear infinite;"></div>
      </div>
      <div style="font-size: 14px; font-weight: 700; letter-spacing: 4px; color: #00E5FF; text-shadow: 0 0 12px rgba(0,229,255,0.6);">SYSTEM INITIALIZING</div>
      <div style="font-size: 11px; color: #7890A8; letter-spacing: 2px; margin-top: 8px; font-family: 'JetBrains Mono', monospace;">LINKING PLAYER TELEMETRY...</div>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Pre-Compiled Instant React 18 Application Bundle -->
  <script src="./dist/habitly.bundle.js" defer></script>
</body>
</html>
